name: Check trung don ve Telegram

# Chay tren may chu GitHub, KHONG phai may Mac cua anh Son.
# May tat, ngu, mat dien, hay Tampermonkey hong — van chay.
#
# Quet 10 phut mot lan, nhung CHI NHAN TIN KHI CO CA TRUNG MOI.
# Ca da bao roi thi thoi, khong lam phien nua (nho trong da_bao.json).
#
# Can hai ma bi mat: TG_TOKEN va TG_CHAT.

on:
  push:
    branches: [claude/telegram-duplicate-order-bot-ayyubm]
    paths:                      # sua ma la quet lai ngay
      - "check_trung_don_cloud.py"
      - "phone_utils.py"
      - ".github/workflows/check-trung-don.yml"
  schedule:
    - cron: "*/10 * * * *"      # moi 10 phut
  workflow_dispatch:

concurrency:
  group: check-trung-don
  cancel-in-progress: false

permissions:
  contents: write               # de ghi lai da_bao.json

jobs:
  quet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/telegram-duplicate-order-bot-ayyubm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: python -m pip install -q requests openpyxl

      - name: Kiem hai ma bi mat
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          thieu=""
          [ -z "$TG_TOKEN" ] && thieu="$thieu TG_TOKEN"
          [ -z "$TG_CHAT" ] && thieu="$thieu TG_CHAT"
          if [ -n "$thieu" ]; then
            echo "::error::Chua dien ma bi mat:$thieu"
            echo "Vao: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "Du hai ma."

      - name: Quet trung don va gui Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python check_trung_don_cloud.py

      - name: Ghi nho cac ca da bao
        run: |
          if [ -n "$(git status --porcelain da_bao.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add da_bao.json
            git commit -m "Cap nhat danh sach ca trung da bao [skip ci]"
            git push
            echo "Da luu trang thai."
          else
            echo "Khong co gi moi de luu."
          fi
